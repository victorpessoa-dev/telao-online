<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b4f8a" />
    <title>Sem conexão | Telão Online</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; color: #142033; background: linear-gradient(145deg, #f5f8fc, #e8eff8); }
      main { width: min(100%, 38rem); padding: clamp(1.75rem, 6vw, 3rem); border: 1px solid #d8e1ed; border-radius: 1.5rem; background: #fff; box-shadow: 0 1.25rem 3.75rem rgb(21 42 73 / 12%); }
      .icon { display: grid; width: 3.5rem; height: 3.5rem; place-items: center; border-radius: 1rem; color: #0b4f8a; background: #e8f2fc; }
      .icon svg { width: 1.8rem; height: 1.8rem; }
      .eyebrow { margin: 2rem 0 0; color: #0b4f8a; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: .7rem 0 0; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; letter-spacing: -.035em; }
      p { max-width: 32rem; margin: 1rem 0 0; color: #526275; line-height: 1.7; }
      a { display: inline-flex; width: 100%; min-height: 2.75rem; align-items: center; justify-content: center; margin-top: 2rem; border-radius: .6rem; color: #fff; background: #0b4f8a; font-weight: 650; text-decoration: none; }
      a:hover { background: #083e6c; }
      a:focus-visible { outline: 3px solid #7ab4e5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M8.7 8.7A7 7 0 0 1 19 14m-3.2 3.2A5 5 0 0 0 17 14m-4.2 4.2A2 2 0 0 0 13 14M3.6 10.6A11 11 0 0 1 6 9" /></svg>
      </div>
      <div class="eyebrow">Conexão</div>
      <h1 id="offline-title">Você está sem internet.</h1>
      <p>Verifique sua rede e tente novamente. Páginas ou dados ainda não salvos podem não carregar.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
